{% extends 'base.html' %}

{% block title %}Add Course{% endblock %}

{% block header %}Add New Course{% endblock %}

{% block content %}
<form action="{{ url_for('courses.add') }}" method="POST" class="styled-form">
    <div class="form-group">
        <label for="name">Course Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Data Science 101">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-submit">Add Course</button>
    </div>
</form>
{% endblock %}
